# Router-only base for AX6000_Router.ini. OpenClash supplies ports and API auth.
# AdGuardHome and MosDNS own client DNS; these public upstreams never loop back.
mode: rule
ipv6: false
bind-address: '*'
log-level: warning
find-process-mode: 'off'
geo-auto-update: false
geodata-loader: memconservative
tcp-concurrent: true
unified-delay: true
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  listen: 127.0.0.1:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter: ['+.lan', '+.local']
  use-hosts: true
  prefer-h3: true
  respect-rules: false
  default-nameserver: [223.5.5.5, 119.29.29.29]
  # Default real lookups use overseas DoH through the current proxy selection.
  nameserver:
    - 'https://1.1.1.1/dns-query#🚀 节点选择'
    - 'https://8.8.8.8/dns-query#🚀 节点选择'
  # Keep domestic/private names off the overseas resolvers. Both lists ship in ROM.
  nameserver-policy:
    'geosite:cn,private':
      - https://223.5.5.5/dns-query#DIRECT&h3=true
      - https://223.6.6.6/dns-query#DIRECT&h3=true
      - 119.29.29.29#DIRECT
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query#DIRECT&h3=true
    - https://223.6.6.6/dns-query#DIRECT&h3=true
    - 119.29.29.29#DIRECT
  proxy-server-nameserver-policy: {}
  direct-nameserver:
    - https://223.5.5.5/dns-query#DIRECT&h3=true
    - https://223.6.6.6/dns-query#DIRECT&h3=true
    - 119.29.29.29#DIRECT
  direct-nameserver-follow-policy: false
  fallback: []
  fallback-filter: {}
sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: false
  sniff:
    HTTP:
      ports: [80, '8080-8880']
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443]
  force-domain: ['+.netflix.com', '+.nflxvideo.net', '+.amazonaws.com', '+.media.dssott.com']
  skip-domain: ['Mijia Cloud', dlg.io.mi.com, '+.oray.com', '+.sunlogin.net', '+.push.apple.com']
proxies: []
proxy-groups: []
rules: []
